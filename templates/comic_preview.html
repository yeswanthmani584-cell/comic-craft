<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft - Preview</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 40px 15px;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: #38bdf8;
            letter-spacing: 1px;
        }
        .panel-card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 35px;
            border: 2px solid #334155;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .panel-header {
            background: #2563eb;
            color: #ffffff;
            padding: 12px 20px;
            font-weight: 700;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .image-container {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
            max-height: 480px;
            border-radius: 6px;
            border: 3px solid #000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .panel-body {
            padding: 22px 25px;
        }
        .scene-desc {
            font-style: italic;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 14px;
            border-left: 3px solid #38bdf8;
            padding-left: 10px;
        }
        .story-text {
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-line;
            color: #e2e8f0;
        }
        .actions {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 20px;
        }
        .btn-download {
            background: #0284c7;
            color: #ffffff;
            padding: 14px 34px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        }
        .btn-download:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ YOUR COMIC PREVIEW ⚡</h1>

        {% for panel in layout %}
        <div class="panel-card">
            <div class="panel-header">Panel {{ panel.panel }}: {{ panel.title }}</div>
            <div class="image-container">
                <img src="/{{ panel.image_path }}" alt="Panel {{ panel.panel }}">
            </div>
            <div class="panel-body">
                <div class="scene-desc">{{ panel.scene_description }}</div>
                <div class="story-text">{{ panel.text }}</div>
            </div>
        </div>
        {% endfor %}

        <div class="actions">
            <a href="{{ pdf_path }}" download class="btn-download" onclick="triggerRedirect('{{ pdf_path }}')">
                📥 Download Your Comic as PDF
            </a>
        </div>
    </div>

    <script>
        function triggerRedirect(pdfPath) {
            setTimeout(function() {
                window.location.href = "/export-success?pdf_path=" + encodeURIComponent(pdfPath);
            }, 1200);
        }
    </script>
</body>
</html>
